name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (dev + deep-learning extras)
        run: pip install -e ".[dev,dl]"

      - name: Lint (ruff)
        run: ruff check src scripts tests

      - name: Type-check (pyright, basic mode)
        run: pyright

      - name: Test (data-free suite)
        run: pytest -m "not requires_data"
