# V2 multimodal SSL fusion — full-run config.
# Inherits V1 per-modality encoder weights, trains a single bidirectional
# cross-attention block + context PMA on healthy windows of D1+D2 under
# combined SimCLR contrastive (on c_t) + Latent Masked Modeling losses.
#
# RQ1 headline: K-means(k=4) cluster purity on c_t, Hungarian-matched to
# D1/D2 folder labels.  A1 ablation: rerun with `drop_vibration: true`.

dataset_configs: [configs/datasets/d1.yaml, configs/datasets/d2.yaml]
output_dir: results/v2/fusion_ssl

# V1 checkpoint paths — load PerModalityEncoder.state_dict() from V1 results.
v1_acoustic_state_dict: results/v1/per_modality_ssl/acoustic.pt
v1_vibration_state_dict: results/v1/per_modality_ssl/vibration.pt

# Window cadence (wall-clock seconds)
window_seconds: 2.0
window_stride_seconds: 1.0

# Encoder dims (must match V1 to allow strict weight transfer)
feature_dim: 128
embed_dim: 128
n_heads: 4
proj_dim: 64

# Training
epochs: 30
batch_size: 32
lr: 1.0e-3
weight_decay: 1.0e-5
temperature: 0.1
val_ratio: 0.3
seed: 42
device: cpu

# Acoustic features (must match V1)
n_mels: 64
n_fft: 1024
hop_length: 512
cwt_n_scales: 64
use_cwt: true

# Vibration features
vib_kurtosis_window: 5

# Augmentations
gain_jitter_db: 6.0
channel_dropout_p: 0.2
spec_augment_freq_mask: 6
spec_augment_time_mask: 8

# Latent Masked Modeling
lmm_mask_p: 0.3
lmm_weight: 1.0

# A1 ablation knob — set true to zero vibration features at the input.
drop_vibration: false

# Used only at sanity-gate evaluation (label-leakage invariant)
healthy_modes: [Pump, Standstill, Turbine, Healthy, RandomFault]
