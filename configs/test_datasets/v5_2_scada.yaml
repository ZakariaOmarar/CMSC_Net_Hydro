# V5.2 — Illwerke Allg_M1 mutual-information ranking.
# Pure offline analysis.  No injection on D2/D3 (the plan explicitly forbids
# fabricated SCADA stand-ins).  Output: top-K Allg_M1 channels by MI with
# the legacy 5-layer pipeline anomaly events, tagged by physical family.

# Inputs
illwerke_data_root: data/illwerke_raw_stub
anomaly_events_path: results/illwerke/pipeline/anomaly_events.json

# Selection
severity_set: [alert]
top_k: 4

# Optional: drop known-uninstalled / always-zero channels here.
forced_drop_channels: []

# Reproducibility
seed: 0

# Output
output_dir: results/v5/v5_2_scada
report_filename: top_k_ranking.json
