# V1 per-modality SSL warmup — full-run config.
# Trains acoustic and vibration encoders independently, label-free, via
# SimCLR-style contrastive on healthy windows of D1+D2.
#
# Sanity gate: K-means(k=4) on per-modality summaries, Hungarian-matched to
# D1/D2 folder labels — purity ≥ 0.55 on held-out recordings.

dataset_configs: [configs/datasets/d1.yaml, configs/datasets/d2.yaml]
output_dir: results/v1/per_modality_ssl

# Window cadence
window_seconds: 2.0
window_stride_seconds: 1.0

# Encoder dims
feature_dim: 128
embed_dim: 128
n_heads: 4
proj_dim: 64

# Training
epochs: 30
batch_size: 32
lr: 1.0e-3
weight_decay: 1.0e-5
temperature: 0.1
val_ratio: 0.3
seed: 42
device: cpu

# Acoustic features
n_mels: 64
n_fft: 1024
hop_length: 512
cwt_n_scales: 64
use_cwt: true

# Vibration features
vib_kurtosis_window: 5

# Augmentations (feature-space)
gain_jitter_db: 6.0
channel_dropout_p: 0.2
spec_augment_freq_mask: 6
spec_augment_time_mask: 8

# Labels — used only at the sanity-gate evaluation step
healthy_modes: [Pump, Standstill, Turbine, Healthy, RandomFault]
