# V1 per-modality SSL warmup — full-run config.
# Trains acoustic and vibration encoders independently, label-free, via
# SimCLR-style contrastive on healthy windows of D1+D2.
#
# Sanity gate: K-means(k=4) on per-modality summaries, Hungarian-matched to
# D1/D2 folder labels — purity ≥ 0.55 on held-out recordings.

dataset_configs: [configs/datasets/d1.yaml, configs/datasets/d2.yaml]
output_dir: results/v1/per_modality_ssl

# Window cadence — legacy single-scale (used as fallback when
# `window_scales_seconds` is empty).
window_seconds: 2.0
window_stride_seconds: 1.0

# Multi-scale window cadence (2026-05-19) — see Chapter 3 §3.4.4.  The
# per-dataset scale dict respects the slowest-vibration-rate constraint:
# D1/D2 vibration at 4 Hz cannot resolve windows below 5 / 4 = 1.25 s
# (one Vibration1DCNN kernel of length 5); D3 at 16 Hz can go down to
# ~0.31 s; D4 at 376 Hz is effectively unconstrained.  Octave-spaced for
# log-uniform coverage (PaSST convention).  Each training batch is
# single-dataset × single-scale via the grouped batch sampler's
# (channel_count, n_frames) bucket key.
window_scales_seconds_per_dataset:
  d1: [1.5, 3.0, 6.0]
  d2: [1.5, 3.0, 6.0]
window_scale_strategy: uniform
window_stride_ratio: 0.5

# Encoder dims
feature_dim: 128
embed_dim: 128
n_heads: 4
proj_dim: 64

# Training
epochs: 30
batch_size: 32
lr: 1.0e-3
weight_decay: 1.0e-5
temperature: 0.1
val_ratio: 0.3
seed: 42
device: auto

# Acoustic features
n_mels: 64
n_fft: 1024
hop_length: 512
cwt_n_scales: 64
use_cwt: true

# Vibration features — physical-time channel-2 statistic.  At D4's ~376 Hz
# raw rate the 100 ms window clears the 31-sample floor and the channel
# carries Joanes-Gill excess kurtosis; at D1/D2 (4 Hz) and D3 (16 Hz) peak
# streams it falls back to rolling crest factor over a 1 s window.  See
# `src/features/vibration_temporal.py` for the full justification.
vib_kurtosis_window_seconds: 0.10
vib_min_kurtosis_samples: 31
vib_crest_factor_window_seconds: 1.0
vib_min_crest_factor_samples: 4

# Augmentations (feature-space)
gain_jitter_db: 6.0
channel_dropout_p: 0.2
spec_augment_freq_mask: 6
spec_augment_time_mask: 8

# Labels — used only at the sanity-gate evaluation step
healthy_modes: [Pump, Standstill, Turbine, Healthy, RandomFault]
