# V0 LSTM-AE anomaly baseline (Khamaisi reference) — full-run training config.
# For a fast smoke run, see configs/test_datasets/v0_lstm_ae_smoke.yaml.

dataset_config: configs/datasets/d1.yaml
output_dir: results/v0/lstm_ae/d1

# Feature extraction
n_mels: 64
n_fft: 1024
hop_length: 512
window_seconds: 1.0
window_overlap: 0.5

# Model
hidden_dim: 128
latent_dim: 32
n_layers: 2
dropout: 0.1

# Training
epochs: 30
batch_size: 64
lr: 1.0e-3
weight_decay: 1.0e-5
val_ratio: 0.2
seed: 42
device: auto

# Labels
healthy_modes: [Pump, Standstill, Turbine, Healthy]
anomaly_modes: [RandomFault]
