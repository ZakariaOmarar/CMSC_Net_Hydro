# V4 anomaly-gated localization head — full-run config.
# Cross3D 3-D CNN on SRP-PHAT volume + Set-Transformer on structure-borne
# accel-TDOA tokens, FiLM-conditioned on V2's c_t, MLP-regressing (x, y, z).
#
# Trained supervised on labeled anomaly windows:
#   - D2 RandomFault `pos_(x,y,z)_<context>` subfolders (spatial label
#     parsed by `test_dataset_loader._parse_labels`).
#   - D3 `hit_between_<a>_<b>_speed1` (spatial label = midpoint of named
#     mic positions; supplied via `spatial_label_overrides`).
#
# A3 ablation: rerun with `unconditional: true`.
# V5.1 reuses this config with `scada_dim: 3` (one-hot D3 speed).
# V5.2 reuses with `scada_dim: K` (top-K Allg_M1 ranking from MI mining).

dataset_configs:
  - configs/datasets/d2.yaml
  - configs/datasets/d3.yaml
  # D5 added 2026-05-20: 6 spatial knock positions extend the supervised
  # localization label pool.  Sensor envelope is identical to D3/D4
  # (shared position.json), so the union grid below already covers D5.
  - configs/datasets/d5.yaml
v2_checkpoint: results/v2/fusion_ssl/encoder.pt
output_dir: results/v4/localization

# SRP-PHAT candidate grid (metres).  Sized to the UNION of D2 + D3 + D4
# sensor envelopes (corrected 2026-05-20):
#
#   D2 (rectangular bench rig): x ∈ [0, 0.155], y ∈ [0, 0.41],
#                               z ∈ [0.12, 0.24] m  (from node_position.txt)
#   D3/D4 (circular 3D-printed): x ∈ [0, 0.11], y ∈ [-0.05, 0.05],
#                                z ∈ [0.01, 0.08] m  (from position.json)
#
# Union + 5 cm margin →  x ∈ [-0.05, 0.20], y ∈ [-0.10, 0.50],
#                        z ∈ [-0.05, 0.30] m.
#
# Grid resolution [16, 32, 16] over those extents gives voxels of
# ~ 1.56 × 1.88 × 2.19 cm — roughly isotropic and matched to the ~ 2 cm
# structure-borne TDOA resolution from parabolic-interpolated GCC-PHAT
# on the 376 Hz accelerometer stream.
#
# The legacy `[-0.5, +0.5] m × [0, 0.6] m` extent was sized for the
# ROW II turbine (1.5 m casing radius) and is grossly oversized for
# either prototype.  An earlier (incorrect) revision used
# `[-0.25, +0.25] m × [-0.05, +0.25] m` which truncated D2's y=0.41 m
# sensor row entirely.
#
# NOTE: a single union grid is sub-optimal because ~ 70 % of the voxels
# are physically irrelevant for D3/D4 samples (their sensors only live
# in y ∈ [-0.05, 0.05]).  The clean long-term fix is per-sample grids
# derived from `mic_xyz` at precompute time — see plan
# `i-want-you-to-pure-cupcake.md` for the refactor.
srp_grid:
  lo: [-0.05, -0.10, -0.05]
  hi: [ 0.20,  0.50,  0.30]
  n:  [16, 32, 16]

# Head dims
cnn_feature_dim: 128
tdoa_feature_dim: 64
hidden_dim: 128
n_heads_tdoa: 2

# Conditioning
scada_dim: 0
unconditional: false  # A3 ablation knob

# Training
epochs: 50
batch_size: 16
lr: 1.0e-3
weight_decay: 1.0e-5
val_ratio: 0.3
seed: 42
device: auto

# Window cadence (defaults to V2 config when omitted)
window_seconds: 2.0
window_stride_seconds: 1.0

# Per-stage window override (2026-05-19) — V4 SRP-PHAT integration window.
# Shorter window → tighter knock spatial signature (less background
# averaging in the GCC-PHAT cross-correlation).  At 0.5 s the knock
# occupies 50/500 ≈ 10 % of the integration window vs 2.5 % at 2 s — a
# 4× SNR improvement on the spatial cross-correlation peak.  Lower
# bound: cross-correlation needs ≥ 8 000 samples for stable peak
# detection (50 % of a 1 s window at 16 kHz) → 0.5 s exactly meets this
# floor on D3/D4.  D1/D2 cannot go below the 1.5 s vibration-kernel
# minimum.
window_seconds_override:
  d1: 1.5
  d2: 1.5
  d3: 0.5
  d4: 0.5
  d5: 0.5   # D5 follows the D3/D4 family
