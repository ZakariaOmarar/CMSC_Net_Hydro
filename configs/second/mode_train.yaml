latent_root: artifacts/latents_second
output_dir: results/second/cnf/mode
epochs: 100
batch_size: 128
lr: 5e-4
weight_decay: 1e-5
hidden_dim: 256
classifier_dropout: 0.2
train_ratio: 0.8
val_ratio: 0.1
test_ratio: 0.1
# 3 folds = safe with 3 recording groups (Pump, Turbine, Standstill)
cv_folds: 3
patience: 30
label_smoothing: 0.1
disable_feature_augment: false
augment_noise_std: 0.02
augment_scale_min: 0.95
augment_scale_max: 1.05
augment_dropout_p: 0.05
mixup_alpha: 0.2
exclude_randomfault: true
selection_metric: val_macro_f1
no_class_weights: false
device: cpu
seed: 42
