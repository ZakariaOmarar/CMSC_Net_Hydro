# Physics-First Mode Detection Pipeline
# Illwerke ROWII Francis Reversible Pump-Turbine
#
# Layer 1: Physics Oracle (Allg_M1 → deterministic labels)
# Layer 2: Transition Typing (signature-based)
# Layer 3: RMS Distillation (LightGBM 13-class + per-mode AEs)
# Layer 4: HMM Smoother (4-state fixed-emission Viterbi)
# Layer 5: Anomaly Detection (per-mode robust z-score)

data_root:  E:/MasterThesisData/illwerke-data-230426
output_dir: results/illwerke/pipeline

# Absolute UTC start of the campaign recording (t=0 in mode_timeline.json).
# Derived: last timeline segment ends at ~April 22 06:38, offset = 628,704 s → epoch = April 15 00:00 UTC.
campaign_epoch_utc: "2026-04-15T00:00:00Z"

# Set true to rerun from scratch regardless of existing checkpoints
force_retrain: false

# ─────────────────────────────────────────────────────────────────────────────
# Data loading
# ─────────────────────────────────────────────────────────────────────────────
data:
  # Restrict to specific campaign days (YYYYMMDD strings). null = all available days.
  days: null

  # RMS dead channels — confirmed uninstalled or flatlined (test.ipynb analysis)
  forced_drop_channels:
    - RmsMic0
    - RmsMic90
    - RmsMic180
    - RmsMic270
    - RmsTurMic0
    - RmsTurMic90
    - RmsTurMic180
    - RmsTurMic270
    - RmsGenVib0X
    - RmsGenVib0Y
    - RmsGenVib0Z
    - RmsTurVib0X
    - RmsTurVib0Y
    - RmsTurVib0Z

  # Allg_M1 dead channels — confirmed flatline for entire 7-day campaign
  # (sensor_freeze check at 3600 s window, exploration_report.json t=0)
  allg_drop_channels:
    - 1_P-Regler_LFR
    - 1_LFR Statik
    - Sys_Watchdog
    - 1_LFR Fern f Soll

  # Head channels in Allg_M1
  upper_head_channel:  "Oberwasserpegel"
  lower_level_channel: "UW_Pegel_Rodund"

# ─────────────────────────────────────────────────────────────────────────────
# Layer 1: Physics Oracle
# ─────────────────────────────────────────────────────────────────────────────
layer1:
  # All thresholds below are STARTING POINTS only.
  # derive_thresholds() will fit GMMs to the actual data and override these values.
  # The derived thresholds are saved to signal_thresholds.json.

  # GMM threshold derivation parameters
  gmm_n_components: 2          # per signal; increase to 3 for multimodal (e.g., power)
  gmm_random_state: 42

  # Hysteresis gap applied symmetrically around the GMM valley
  gate_hysteresis_pct:  2.0    # enter/exit gate_open threshold
  valve_hysteresis_pct: 2.0

  # PH windage band ceiling (|power| below this AND gate sealed → PH candidate)
  windage_ceiling_mw:   10.0

  # STEADY stability thresholds (rolling std over steady_window_s)
  steady_window_s:      30
  stable_gate_pct:       0.5
  stable_rpm_rpm:        5.0
  stable_power_mw:       5.0

  # Debounce: a label flip must persist this many seconds to commit
  debounce_s: 5

  # Sensor freeze detection
  # 3600 s (1 h) — shorter windows trigger on SCADA quantisation during steady state
  freeze_window_s: 3600

  # χ² head-independence test significance level
  head_independence_alpha: 0.05

# ─────────────────────────────────────────────────────────────────────────────
# Layer 2: Transition Typing
# ─────────────────────────────────────────────────────────────────────────────
layer2:
  # Intervals shorter than this are flagged MICRO_EVENT
  micro_event_threshold_s: 60

  # How far to search before/after an interval for flanking steady labels
  search_window_s: 3600

  # SFC active current threshold for startup signature checks
  sfc_active_min_duration_s: 60   # SFC must be active for at least this long

# ─────────────────────────────────────────────────────────────────────────────
# Layer 3: RMS Distillation
# ─────────────────────────────────────────────────────────────────────────────
layer3:
  # Feature extraction
  feature_windows_s: [5, 60, 300]         # rolling energy windows
  head_poly_degree:  2                     # global polynomial for head residualization
  cavitation_kurtosis_threshold: 8.0       # flag timestep if any channel kurtosis > this
  train_day_fraction: 0.75                 # first fraction of campaign used for fitting

  # LightGBM classifier
  lgbm:
    n_leaves:          63
    n_estimators:      500
    learning_rate:     0.05
    feature_fraction:  0.8
    bagging_fraction:  0.8
    bagging_freq:      5
    random_seed:       42
    n_jobs:            -1

  # Training set assembly
  max_steady_ratio: 5     # max steady-state samples = min_transition_class × this

  # Per-mode autoencoders
  ae:
    d_feat:        33       # must match FEATURE_DIM in features.py
    hidden:        32
    bottleneck:    16
    window_s:      60
    window_stride: 15
    epochs:        30
    batch_size:    64
    lr:            1.0e-3
    random_seed:   42

# ─────────────────────────────────────────────────────────────────────────────
# Layer 4: HMM Smoother
# ─────────────────────────────────────────────────────────────────────────────
layer4:
  # Self-loop bias in the transition matrix initialisation
  self_loop_bias: 10.0

  # Segment post-processing
  micro_event_threshold_s: 60

# ─────────────────────────────────────────────────────────────────────────────
# Layer 5: Anomaly Detection
# ─────────────────────────────────────────────────────────────────────────────
layer5:
  # Rolling baseline window (seconds); 86400 = 24 hours
  baseline_window_s: 86400
  min_baseline_samples: 300

  # Alert thresholds (robust z-score)
  watch_sigma: 4.0
  alert_sigma: 6.0

  # Event post-processing
  min_event_duration_s: 5
  merge_gap_s:          30

  # TU load-band boundaries as fractions of rated power
  tu_load_bands: [0.0, 0.20, 0.60, 0.90, 1.01]

seed: 42
